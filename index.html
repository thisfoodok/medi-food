<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이거 먹어도 돼?</title>
  <meta name="theme-color" content="#3b82f6">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>이거 먹어도 돼?</h1>
    <p class="sub">약봉투를 찍거나 약 이름을 검색해 확인하세요.</p>

    <!-- 여러 약을 합친 음식 궁합 요약 (맨 위에 먼저 보임) -->
    <section id="summary" class="summary"></section>

    <!-- 인식된 약 버튼 목록 (누르면 아래에 개별 상세가 펼쳐짐) -->
    <section id="selected" class="selected"></section>

    <!-- 선택한 약의 개별 상세 -->
    <section id="results" class="results"></section>

    <!-- 약봉투 촬영/업로드 (아래로 이동) -->
    <div class="scan-box">
      <label for="photoInput" class="scan-btn">📷 약봉투 사진 찍기 / 올리기</label>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
      <p id="ocrStatus" class="ocr-status"></p>
    </div>

    <!-- 직접 검색 (아래로 이동) -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="또는 약 이름 검색: 타이레놀…" autocomplete="off">
      <ul id="suggestions" class="suggestions"></ul>
    </div>



    <footer class="disclaimer">
      ⚠️ 이 정보는 일반적인 참고용이며 의학적 조언이 아닙니다.
      복약과 관련된 최종 판단은 반드시 의사·약사와 상담하세요.
    </footer>
  </main>

  <!-- OCR 엔진 (무료 CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script src="js/lookup.js"></script>
  <script src="js/matcher.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((reg) => reg.unregister());
      });
    }
    if (window.caches) {
      caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
    }
  </script>

</body>
</html>
